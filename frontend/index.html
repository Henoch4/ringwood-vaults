<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ringwood Vaults</title><meta name="description" content="Auto-compounding yield vaults on BOT Chain:create, deposit, compound, withdraw."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,500;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>
:root{--motion-fast:200ms;--motion-base:600ms;--motion-slow:1100ms;--bg:#dde8d3;--ink:#0d2b1c;--moss:#2f6b45;--peach:#f2a77a;--cream:#f4f1e4;--line:#0d2b1c33}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.55 'Outfit',sans-serif;overflow-x:hidden}
.top{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:12px 22px;gap:10px;flex-wrap:wrap;background:#dde8d3dd;backdrop-filter:blur(8px)}
.brand{font:italic 600 28px 'Cormorant Garamond',serif;color:var(--ink);text-decoration:none}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{background:var(--ink);color:var(--cream);padding:6px 12px;border-radius:99px;font-size:12px}
select,input{font:inherit;background:var(--cream);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:8px 14px;width:100%}
select{width:auto}
.xl{display:flex;gap:6px;align-items:center;text-decoration:none;color:var(--ink);font-size:13px;padding:8px 12px;border-radius:99px;border:1px solid var(--ink)}.xl:hover{background:var(--ink);color:var(--cream)}
button{font:500 14px 'Outfit';background:var(--ink);color:var(--cream);border:0;border-radius:99px;padding:10px 20px;cursor:pointer;transition:.3s}button:hover{background:var(--moss);letter-spacing:.04em}
button.pe{background:var(--peach);color:var(--ink)}button.ol{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.wrap{display:grid;grid-auto-flow:dense;grid-template-columns:minmax(320px,44%) 1fr}
.left{position:sticky;top:0;height:100vh;padding:100px 22px 24px 30px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.left h1{font:300 clamp(3.6rem,8.5vw,9rem)/.88 'Cormorant Garamond',serif;letter-spacing:-.03em}.left h1 em{color:var(--moss);font-weight:600}
.launch{display:inline-block;background:var(--peach);padding:6px 14px;border-radius:99px;font-weight:500;font-size:14px;margin-bottom:18px}
.rings{position:absolute;right:-22%;bottom:-12%;width:92%;opacity:.55;animation:sway 24s ease-in-out infinite alternate}
@keyframes sway{to{transform:rotate(25deg) scale(1.06)}}
.left p{max-width:34ch;position:relative}
.right{padding:110px 30px 40px 10px;display:grid;gap:34px}
.panel{background:var(--cream);border-radius:28px;padding:26pxdisplay:grid;gap:12px}
.panel h2{font:italic 500 38px 'Cormorant Garamond',serif}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:grid;gap:4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--moss)}
.vault{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center;background:var(--cream);border-radius:200px 28px 28px 200px;padding:20px 28px 20px 20px;transition:transform .5s,box-shadow .5s}
.vault:hover{transform:translateX(-14px);box-shadow:14px 14px 0 var(--ink)}
.vault svg{width:150px;height:150px}
.vault h3{font:500 34px/1 'Cormorant Garamond',serif}.vault .nums{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0 12px;font-size:13px;color:var(--moss)}.vault .nums b{display:block;font:600 22px 'Outfit';color:var(--ink)}
.vault .ctl{display:flex;gap:8px;flex-wrap:wrap}.vault .ctl input{width:110px;padding:7px 12px}
.calc{background:var(--ink);color:var(--cream);border-radius:28px;padding:26px}.calc h2{font:italic 500 38px 'Cormorant Garamond',serif;margin-bottom:10px}.calc input{background:transparent;color:var(--cream);border-color:#f4f1e455}
.calc svg{width:100%;height:150px;margin-top:10px}.calc big{display:block;font:300 56px/1 'Cormorant Garamond',serif;color:var(--peach)}
#mode{font-size:12px;letter-spacing:.14em;color:var(--moss)}
.stat{font:300 90px/1 'Cormorant Garamond',serif}.stat small{font:14px 'Outfit';margin-left:10px}
.rv{opacity:0;transform:translateX(60px) scale(.96);transition:1s cubic-bezier(.2,.9,.2,1)}.rv.in{opacity:1;transform:none}
#toast{position:fixed;right:20px;bottom:70px;background:var(--ink);color:var(--cream);padding:12px 20px;border-radius:99px;opacity:0;transform:translateY(20px);transition:.4s;z-index:90;max-width:85vw}#toast.on{opacity:1;transform:none}
footer{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;padding:26px 30px;background:var(--ink);color:#dde8d3bb;font-size:13px}footer a{color:var(--peach)}footer b{color:var(--cream)}.mono{font-family:ui-monospace,monospace;word-break:break-all}
@keyframes grow{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
.vault circle{fill:none;stroke-dasharray:400;animation:grow 1.4s ease both}
@media(max-width:860px){.wrap{grid-template-columns:1fr}.left{position:relative;height:auto;min-height:92vh;padding:120px 22px 40px}.right{padding:10px 16px 30px}.vault{grid-template-columns:1fr;border-radius:28px;justify-items:center;text-align:center}.vault .nums,.vault .ctl{justify-content:center}.row{grid-template-columns:1fr}.top{position:absolute}}

@media(prefers-reduced-motion:reduce){.rv{transition:none!important;opacity:1;transform:none!important}*{animation:none!important}}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc,currentColor);outline-offset:2px}</style><link href="./product.css" rel="stylesheet"><script defer src="./vendor/ethers.umd.min.js"></script><script defer src="./product.js"></script></head><body class="suite-product su-console" id="top"><div class="suite-nav" role="navigation" aria-label="Main navigation"><a class="suite-brand" href="#top">Ringwood Vaults</a><span id="suite-network" role="status">Checking mainnet…</span><button id="suite-wallet" type="button" disabled>Connect wallet</button><button id="suite-disconnect" type="button" hidden>Disconnect</button><a href="#suite-workspace">Open app</a></div>
